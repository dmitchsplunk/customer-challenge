# Read by the build skills. Facts only. UNANSWERED means the customer didn't say; do not guess.
customer: "Automotive manufacturer, internal platform team"
slug: "auto-manufacturer-platform"
vertical: "Automotive; internal platform engineering"
agent:
  name: "Internal-tools assistant for platform engineers"
  purpose: "Takes a plain-language request from an engineer and runs searches, checks host status, or edits alerts in Splunk through the platform team's tools"
  users: "Internal engineers, from whatever coding assistant they use"
  inputs: "natural-language requests"
  outputs: "search results, alert changes, summaries"
  tools_and_data: ["search events", "host status", "update alert"]
stack:
  language: python
  framework: pure-python      # challenge path; in production their tools sit behind MCP servers
  model_provider: hosted, through the workshop gateway
  model: the model the workshop gateway provides
  hosting: cloud
  uses_mcp: true
traffic: UNANSWERED
constraints:
  - "own inference gateway in front of the model"
  - "owners of many agents must see only their own data"
competing_tools: ["homegrown tooling for token cost and pieces of monitoring"]
feared_failure:
  quote: "They make different choices about which tools to call when given the same prompt. I just wrote this thing, is it any good? Is it being used the way I think it is?"
  speaker: "Platform lead"
  kind: wrong_tool
stakeholders:
  - "Platform lead, owns the internal tools / tool quality, token cost per consumer, per-owner segregation"
  - "Platform engineer / use-case specifics"
