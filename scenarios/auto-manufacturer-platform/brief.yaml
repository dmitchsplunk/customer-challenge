# Read by the build skills. Facts only. UNANSWERED means the customer didn't say; do not guess.
customer: "Automotive manufacturer, internal platform team"
slug: "auto-manufacturer-platform"
vertical: "Automotive; internal platform engineering"
agent:
  name: "Internal-tool MCP server and the agents that use it"
  purpose: "A read-write MCP over their on-prem Splunk and other internal tools, used through various harnesses to run searches and edit alerts"
  users: "Internal engineers, through whatever harness they use"
  inputs: "natural-language requests from a coding or chat harness"
  outputs: "search results, alert changes, summaries"
  tools_and_data: ["search events", "host status", "update alert"]
stack:
  language: python
  framework: pure-python      # challenge path; in production their tools sit behind MCP servers
  model_provider: bedrock
  model: Bedrock, behind their own gateway
  hosting: on-prem
  uses_mcp: true
traffic: UNANSWERED
constraints:
  - "fully on-prem; no cloud services"
  - "own inference gateway in front of the model"
  - "owners of many agents must see only their own data"
competing_tools: ["homegrown tooling for token cost and pieces of monitoring"]
feared_failure:
  quote: "Different harnesses make different choices about which tools to call when given the same prompt. I just wrote this thing, is it any good? Is it being used the way I think it is?"
  speaker: "Platform lead"
  kind: wrong_tool
stakeholders:
  - "Platform lead, owns the Splunk MCP / MCP quality across harnesses, token cost per consumer, feedback into evals, segregation"
  - "Platform engineer / use-case specifics"
  - "Platform engineer / which product is which"
